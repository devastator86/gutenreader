<!DOCTYPE html>
<html lang="en" data-theme="sepia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GutenReader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/reader.css">
</head>
<body>
  <header class="app-header">
    <a href="#search" class="app-logo" aria-label="GutenReader home">
      <img src="./assets/icon.svg" alt="" width="28" height="28">
      <span>GutenReader</span>
    </a>
    <nav class="app-nav">
      <a href="#search" class="nav-link" data-view="search">Search</a>
      <a href="#library" class="nav-link" data-view="library">Library</a>
    </nav>
  </header>

  <main id="main-content" role="main"></main>

  <script src="./js/app.js"></script>
  <script src="./js/search.js"></script>
  <script src="./js/library.js"></script>
  <script src="./js/reader.js"></script>
  <script src="./js/settings.js"></script>
</body>
</html>
